{% extends "base.html" %}
{% block title %}{{ T.seller_add_title }}{% endblock %}
{% block content %}
<h2>{{ T.seller_add_heading }}</h2>
<form method="POST">
  <div class="mb-3">
    <label>{{ T.seller_username }}</label>
    <input name="username" class="form-control" required>
  </div>
  <div class="mb-3">
    <label>{{ T.seller_password }}</label>
    <input name="password" type="password" class="form-control" required>
  </div>
  <div class="mb-3">
    <label>{{ T.seller_profile_img }}</label>
    <input name="profile_img" class="form-control">
  </div>
  <div class="mb-3">
    <label>{{ T.seller_salary }}</label>
    <input type="number" step="0.01" name="salary" class="form-control" value="{{ seller.salary if seller else '' }}">
  </div>

  <div class="mb-3 form-check">
    <input type="checkbox" name="activated" class="form-check-input" id="activatedCheck" {% if seller and seller.activated %}checked{% endif %}>
    <label class="form-check-label" for="activatedCheck">{{ T.seller_activated }}</label>
  </div>

  <button class="btn btn-success" type="submit">{{ T.seller_add_submit }}</button>
  <a href="{{ url_for('list_sellers') }}" class="btn btn-secondary">{{ T.common_cancel }}</a>
</form>
{% endblock %}
